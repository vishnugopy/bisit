<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sign up</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; }
  .wrap { width: 480px; margin: 40px auto; padding: 32px; background: #fff;
    border: 1px solid #e5e7eb; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.12); }
  .title { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: #9ca3af; margin-bottom: 24px; }
  input[type=text], input[type=email], input[type=password] {
    display: block; width: 100%; box-sizing: border-box; padding: 12px 14px; margin-bottom: 16px;
    border: 1px solid #d1d5db; border-radius: 10px; font-size: 16px; outline: none;
  }
  input::placeholder { color: #bbb; }
  input.bad { border-color: #ef4444; }
  .err { color: #ef4444; font-size: 13px; margin: -10px 0 16px; }
  .terms { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 14px; }
  .terms input { width: 14px; height: 14px; }
  .btn { background: #6366f1; color: #fff; text-align: center; padding: 14px; border-radius: 10px;
    font-weight: 600; cursor: pointer; }
  .foot { margin-top: 20px; text-align: center; font-size: 14px; color: #6b7280; }
  .foot a { color: #8ab4f8; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">Create your account</div>
  <div class="sub">Start your 14-day free trial. No credit card required.</div>
  <form>
    <input type="text" placeholder="Full name">
    <input type="email" class="bad" placeholder="Email address" value="alex@example">
    <div class="err">Enter a valid email address</div>
    <input type="password" placeholder="Password (8+ characters)">
    <div class="terms">
      <input type="checkbox" id="t">
      <span>I agree to the <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a></span>
    </div>
    <div class="btn" onclick="document.forms[0].submit()">Create account</div>
  </form>
  <div class="foot">Already have an account? <a href="/login">Log in</a></div>
</div>
</body>
</html>
