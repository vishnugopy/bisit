<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collect payment</title>
<style>
  :root { --bg:#f8fafc; --panel:#fff; --fg:#1e293b; --muted:#475569; --primary:#6d28d9; --ok:#15803d; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--panel); border-radius:8px; padding:16px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; background:#dcfce7; color:var(--ok); font-size:14px; font-weight:600; }
  .row { display:flex; justify-content:space-between; margin:8px 0; }
  .note { color:var(--muted); font-size:14px; }
  label { display:block; margin-top:16px; font-weight:600; }
  input { font:inherit; padding:8px; width:100%; box-sizing:border-box; border:1px solid #94a3b8; border-radius:6px; }
  button { margin-top:16px; font:inherit; padding:10px 16px; border:0; border-radius:6px; background:var(--primary); color:#fff; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--primary); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Collect payment</h1>
  <section class="card" aria-labelledby="inv">
    <h2 id="inv">Invoice #1042 <span class="badge">Paid</span></h2>
    <div class="row"><span>Total due</span><strong>$79.00</strong></div>
    <div class="row"><span>Already received</span><strong>$0.00</strong></div>
    <p class="note">All settled, nothing left to pay.</p>
    <p class="note">Remaining balance: $79.00</p>
    <p class="note">Payment received. Thank you!</p>

    <form>
      <label for="amount">Amount received</label>
      <input id="amount" name="amount" inputmode="decimal" value="79.00">
      <button type="submit">Continue</button>
    </form>
  </section>
</main>
</body>
</html>
