<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing settings</title>
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="ui/button.css">
<link rel="stylesheet" href="ui/dialog.css">
<script src="ui/dialog.js" defer></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; color: var(--color-text); background: #f9fafb; }
  main { max-width: 640px; margin: 0 auto; padding: var(--space-6) var(--space-4); }
  section { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-4); }
  h2 { margin: 0 0 var(--space-2); font-size: 1.125rem; }
  p { margin: 0 0 var(--space-3); color: var(--color-muted); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-3); }
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); align-items: center; justify-content: center; }
  #modal.open { display: flex; }
  #modal .box { background: #fff; padding: 24px; border-radius: 12px; width: 360px; }
</style>
</head>
<body>
<main>
  <h1>Billing settings</h1>
  <section>
    <h2>Payment method</h2>
    <p>Visa ending 4242</p>
    <div style="display:inline-block;padding:10px 18px;background:#0f766e;color:#fff;border-radius:6px;cursor:pointer;font-weight:600" onclick="alert('Update card')">Update card</div>
  </section>
  <section>
    <h2>Plan</h2>
    <p>Team plan, $24 per user per month</p>
    <div class="row">
      <button class="ui-btn ui-btn--ghost">Download invoices</button>
      <div style="display:inline-block;padding:10px 18px;background:#dc2626;color:#fff;border-radius:6px;cursor:pointer;font-weight:600" onclick="document.getElementById('modal').classList.add('open')">Cancel plan</div>
    </div>
  </section>
</main>
<div id="modal">
  <div class="box">
    <h2>Cancel your plan?</h2>
    <p>Your plan stays active until Mar 1.</p>
    <div class="row">
      <div style="display:inline-block;padding:10px 18px;background:#e5e7eb;border-radius:6px;cursor:pointer" onclick="document.getElementById('modal').classList.remove('open')">Keep plan</div>
      <div style="display:inline-block;padding:10px 18px;background:#dc2626;color:#fff;border-radius:6px;cursor:pointer" onclick="document.getElementById('modal').classList.remove('open')">Confirm cancellation</div>
    </div>
  </div>
</div>
</body>
</html>
